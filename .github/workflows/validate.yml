name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Manifests (JSON Schema + cross checks)
        run: |
          pip install --quiet jsonschema==4.23.0
          python3 tools/validate.py
          python3 tools/test_validate.py
          python3 tools/test_lifecycle.py

      - name: shellcheck
        run: |
          files=$(find apps -type f ! -name manifest.json ! -path '*/icons/*'; echo lib/obox.sh; ls tools/*.sh)
          shellcheck -x -e SC1091 $files

      - name: Build is deterministic
        run: |
          python3 tools/build.py --sequence 1 --out a --generated-at 2000-01-01T00:00:00Z
          python3 tools/build.py --sequence 1 --out b --generated-at 2000-01-01T00:00:00Z
          cmp a/catalog-1.tar.gz b/catalog-1.tar.gz

      # 每个应用的 status 冒烟(不论有没有 ci/<id>.json);全流程见下面两个 lifecycle 任务。
      - name: status smoke (ubuntu-24.04 VM)
        run: |
          for app in apps/*/; do
            id=$(basename "$app"); tmp=$(mktemp -d /tmp/obox-XXXXXX); chmod 700 "$tmp"
            mkdir "$tmp/lib"; cp "$app"/* "$tmp"/; cp lib/obox.sh "$tmp/lib/"
            out=$(sudo -n "$tmp/status"); rm -rf "$tmp"
            last=$(tail -1 <<<"$out")
            [[ $last == OBOX_RESULT\ * ]] || { echo "$id: last line is not OBOX_RESULT"; exit 1; }
            python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["state"] in ("running","stopped","failed","not_installed"), r' "${last#OBOX_RESULT }"
            echo "$id: $last"
          done

  # C-3:按 ci/<id>.json 跑 install → status → uninstall → status,执行方式与 App 执行器一致(tools/lifecycle.py)。
  lifecycle-ubuntu-24-04:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle on the runner VM (systemd, sudo -n)
        run: python3 tools/lifecycle.py --target local --os ubuntu-24.04

  # GitHub 没有 Debian runner:在 ubuntu runner 上起 incus 系统容器(完整 systemd),
  # 透传 /dev/net/tun(tailscaled 等需要);以 root 执行,对应「隧道会话是 root」的情形。
  lifecycle-debian:
    runs-on: ubuntu-24.04
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    name: lifecycle-debian-${{ matrix.debian }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Debian ${{ matrix.debian }} system container
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q incus
          sudo incus admin init --auto
          # runner 上的 docker 把 FORWARD 默认策略设成 DROP,会切断 incus 网桥出网
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT 2>/dev/null || true
          sudo iptables -I DOCKER-USER -o incusbr0 -j ACCEPT 2>/dev/null || true
          sudo incus launch images:debian/${{ matrix.debian }} deb
          sudo incus config device add deb tun unix-char source=/dev/net/tun path=/dev/net/tun
          for i in $(seq 1 60); do
            sudo incus exec deb -- getent hosts deb.debian.org >/dev/null 2>&1 && break
            sleep 2
          done
          # 等 systemd 起完再跑配方(装包、启服务的配方在 starting 阶段会偶发失败);degraded 也算起完
          sudo incus exec deb -- sh -c '. /etc/os-release; echo "$PRETTY_NAME"; timeout 120 systemctl is-system-running --wait || true'
      - name: Lifecycle in Debian ${{ matrix.debian }}
        run: sudo python3 tools/lifecycle.py --target incus:deb --os debian-${{ matrix.debian }}
